name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ler versao do manifest
        id: manifest
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Validar tag contra o manifest
        if: github.ref_type == 'tag'
        run: |
          if [ "v${{ steps.manifest.outputs.version }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} nao corresponde a versao do manifest (v${{ steps.manifest.outputs.version }})."
            echo "Atualize a versao no manifest.json ou corrija a tag."
            exit 1
          fi

      - name: Gerar zip da extensao
        run: |
          # Somente os arquivos que a extensao precisa (pronto para carregar no Chrome)
          zip -r "mornio-extension-v${{ steps.manifest.outputs.version }}.zip" \
            manifest.json \
            newtab.html \
            css \
            js \
            icons
          unzip -l "mornio-extension-v${{ steps.manifest.outputs.version }}.zip"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: Mornio v${{ steps.manifest.outputs.version }}
          files: mornio-extension-v${{ steps.manifest.outputs.version }}.zip
          generate_release_notes: true
