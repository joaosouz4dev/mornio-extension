name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ler versao do manifest
        id: manifest
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Verificar se a versao ja tem release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.manifest.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v${{ steps.manifest.outputs.version }} ja existe. Nada a fazer."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Versao nova: v${{ steps.manifest.outputs.version }}"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar zip da extensao
        if: steps.check.outputs.exists == 'false'
        run: |
          # Somente os arquivos que a extensao precisa (pronto para carregar no Chrome)
          zip -r "mornio-extension-v${{ steps.manifest.outputs.version }}.zip" \
            manifest.json \
            newtab.html \
            css \
            js \
            icons
          unzip -l "mornio-extension-v${{ steps.manifest.outputs.version }}.zip"

      - name: Publicar tag e release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: Mornio v${{ steps.manifest.outputs.version }}
          files: mornio-extension-v${{ steps.manifest.outputs.version }}.zip
          generate_release_notes: true

      # Requer os segredos CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET
      # e CWS_REFRESH_TOKEN configurados no repositorio. Sem eles, e pulado.
      - name: Publicar na Chrome Web Store
        if: steps.check.outputs.exists == 'false' && env.CWS_EXTENSION_ID != ''
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "mornio-extension-v${{ steps.manifest.outputs.version }}.zip" \
            --auto-publish
