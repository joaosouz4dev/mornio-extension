<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova guia</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg-a" class="bg"></div>
  <div id="bg-b" class="bg"></div>
  <div class="overlay"></div>

  <main class="layout">

   <div class="top-group">
    <!-- Barra de favoritos -->
    <nav id="bookmarks-bar" class="bookmarks-bar hidden" aria-label="Favoritos"></nav>

    <!-- Barra superior -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-tasks" class="quick-item" title="Tarefas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 14v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Tarefas</span>
        </button>
        <button id="btn-notes-top" class="quick-item" title="Notas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span>Notas</span>
        </button>
        <button id="btn-shuffle" class="quick-item" title="Trocar foto de fundo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Foto</span>
        </button>
      </div>
      <div class="topbar-right">
        <div id="world-clocks" class="world-clocks"></div>
        <div class="weather">
          <span id="weather-icon" class="weather-icon"></span>
          <span class="weather-info">
            <span id="weather-temp" class="weather-temp">--°</span>
            <span id="weather-city" class="weather-city">...</span>
          </span>
        </div>
      </div>
    </header>
   </div>

    <!-- Centro -->
    <section class="center">
      <h1 id="clock" class="clock">00:00</h1>
      <h2 id="greeting" class="greeting">Olá.</h2>
    </section>

    <!-- Rodapé -->
    <footer class="bottombar">
      <div class="bottom-left">
        <button id="btn-settings" class="icon-btn" title="Configurações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div class="bottom-center">
        <p id="quote" class="quote"></p>
        <p id="quote-author" class="quote-author"></p>
      </div>
      <div class="bottom-right">
        <button id="btn-notes" class="text-btn">Notas</button>
      </div>
    </footer>
  </main>

  <!-- Painel de notas -->
  <aside id="notes-panel" class="side-panel side-panel-right">
    <div class="panel-header">
      <h3>Notas</h3>
      <button id="notes-close" class="icon-btn" title="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <textarea id="notes-text" class="notes-text" placeholder="Escreva suas anotações aqui... (salvas automaticamente)"></textarea>
  </aside>

  <!-- Painel de tarefas -->
  <aside id="tasks-panel" class="side-panel side-panel-left">
    <div class="panel-header">
      <h3>Tarefas</h3>
      <button id="tasks-close" class="icon-btn" title="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <input id="task-input" class="task-input" type="text" maxlength="120" placeholder="Nova tarefa... (Enter para adicionar)" autocomplete="off">
    <ul id="tasks-list" class="tasks-list"></ul>
  </aside>

  <!-- Modal de configurações -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-header">
        <h3 id="settings-title">Configurações</h3>
        <button id="set-close" class="icon-btn" title="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <label class="field">
          <span>Seu nome</span>
          <input id="set-name" type="text" maxlength="40" autocomplete="off">
        </label>

        <div class="field">
          <span>Cidade do clima</span>
          <div class="city-search">
            <input id="set-city" type="text" placeholder="Digite para buscar... Ex.: Carangola" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="city-results">
            <ul id="city-results" class="city-results hidden" role="listbox"></ul>
          </div>
          <p id="set-city-status" class="field-status"></p>
        </div>

        <div class="field">
          <span>Relógios mundiais <em class="field-hint">máx. 6</em></span>
          <div id="zones-list" class="zones-list"></div>
          <div class="city-search">
            <input id="zone-input" type="text" placeholder="Buscar fuso... Ex.: Sao Paulo, Tokyo" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="zone-results">
            <ul id="zone-results" class="city-results hidden" role="listbox"></ul>
          </div>
        </div>

        <div class="field field-row">
          <div class="field-row-text">
            <strong>Barra de favoritos</strong>
            <small>Exibe seus favoritos do Chrome no topo da página</small>
          </div>
          <label class="switch">
            <input id="set-bookmarks" type="checkbox">
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button id="set-cancel" class="btn-secondary">Cancelar</button>
        <button id="set-save" class="btn-primary">Salvar</button>
      </div>

      <div class="modal-brand">
        <img src="icons/icon-48.png" alt="" class="brand-logo">
        <span class="brand-name">Mornio</span>
        <span class="brand-sep">·</span>
        <span>criado por <a href="https://joaovictorsouza.dev" target="_blank" rel="noopener">joaovictorsouza.dev</a></span>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
